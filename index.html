<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Schulungsbestätigung - EDU Campus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-gray-100">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useRef, useEffect } = React;

      // n8n Webhook URL
      const WEBHOOK_URL = 'https://localdevai.app.n8n.cloud/webhook/schulungsbestaetigung';

      // Icons
      const CheckCircle = ({ className = "w-6 h-6" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"
             strokeLinecap="round" strokeLinejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <path d="m9 11 3 3L22 4"></path>
        </svg>
      );
      
      const XCircle = ({ className = "w-6 h-6" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"
             strokeLinecap="round" strokeLinejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="m15 9-6 6"></path>
          <path d="m9 9 6 6"></path>
        </svg>
      );
      
      const Download = ({ className = "w-6 h-6" }) => (
        <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"
             strokeLinecap="round" strokeLinejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <path d="M7 10l5 5 5-5"></path>
          <path d="M12 15V3"></path>
        </svg>
      );

      function SignatureForm() {
        const [formData, setFormData] = useState({
          email: "",
          courseId: "",
          courseName: "",
          understood: false,
        });
        const [isDrawing, setIsDrawing] = useState(false);
        const [signatureData, setSignatureData] = useState(null);
        const [submitted, setSubmitted] = useState(false);
        const [isSubmitting, setIsSubmitting] = useState(false);
        const canvasRef = useRef(null);
        const contextRef = useRef(null);

        // Canvas Setup (HiDPI)
        useEffect(() => {
          const canvas = canvasRef.current;
          const dpr = window.devicePixelRatio || 1;
          const displayWidth = canvas.offsetWidth;
          const displayHeight = 160;
          canvas.style.height = displayHeight + "px";
          canvas.height = Math.floor(displayHeight * dpr);
          canvas.width = Math.floor(displayWidth * dpr);
          canvas.style.width = displayWidth + "px";

          const ctx = canvas.getContext("2d");
          ctx.scale(dpr, dpr);
          ctx.lineCap = "round";
          ctx.strokeStyle = "#1e40af";
          ctx.lineWidth = 2;
          contextRef.current = ctx;
        }, []);

        const getPos = (evt) => {
          const canvas = canvasRef.current;
          const rect = canvas.getBoundingClientRect();
          if (evt.clientX !== undefined && evt.clientY !== undefined) {
            return {
              x: evt.clientX - rect.left,
              y: evt.clientY - rect.top,
            };
          }
          if (evt.touches && evt.touches[0]) {
            return {
              x: evt.touches[0].clientX - rect.left,
              y: evt.touches[0].clientY - rect.top,
            };
          }
          return null;
        };

        const startDrawing = (evt) => {
          evt.preventDefault();
          const pos = getPos(evt);
          if (!pos) return;
          contextRef.current.beginPath();
          contextRef.current.moveTo(pos.x, pos.y);
          setIsDrawing(true);
        };

        const draw = (evt) => {
          if (!isDrawing) return;
          evt.preventDefault();
          const pos = getPos(evt);
          if (!pos) return;
          contextRef.current.lineTo(pos.x, pos.y);
          contextRef.current.stroke();
        };

        const stopDrawing = () => {
          if (!isDrawing) return;
          contextRef.current.closePath();
          setIsDrawing(false);
          setSignatureData(canvasRef.current.toDataURL("image/png"));
        };

        const clearSignature = () => {
          const canvas = canvasRef.current;
          const ctx = contextRef.current;
          ctx.save();
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.restore();
          ctx.lineCap = "round";
          ctx.strokeStyle = "#1e40af";
          ctx.lineWidth = 2;
          setSignatureData(null);
        };

        const handleSubmit = async (e) => {
          e.preventDefault();

          if (!formData.understood) {
            alert("Bitte bestätigen Sie, dass Sie die Inhalte verstanden haben.");
            return;
          }
          if (!signatureData) {
            alert("Bitte unterschreiben Sie das Formular.");
            return;
          }

          setIsSubmitting(true);

          const submissionData = {
            ...formData,
            signature: signatureData,
            timestamp: new Date().toISOString(),
            ipAddress: "Wird vom Server erfasst",
          };

          console.log("📤 Sende Schulungsbestätigung:", submissionData);

          try {
            const response = await fetch(WEBHOOK_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(submissionData)
            });

            if (!response.ok) {
              throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }

            const result = await response.json();
            console.log("✅ Erfolgreich gesendet:", result);
            setSubmitted(true);
            
          } catch (error) {
            console.error("❌ Fehler beim Senden:", error);
            alert("❌ Fehler beim Übermitteln der Bestätigung:\n\n" + error.message + "\n\nBitte versuchen Sie es erneut oder kontaktieren Sie den Support.");
          } finally {
            setIsSubmitting(false);
          }
        };

        const downloadCertificate = () => {
          const data = {
            email: formData.email,
            courseName: formData.courseName,
            courseId: formData.courseId,
            date: new Date().toLocaleDateString("de-DE", {
              day: '2-digit',
              month: 'long',
              year: 'numeric'
            }),
            timestamp: new Date().toISOString(),
            signature: signatureData,
          };
          
          const blob = new Blob([JSON.stringify(data, null, 2)], {
            type: "application/json",
          });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `schulungsbestaetigung-${formData.email}-${Date.now()}.json`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        };

        if (submitted) {
          return (
            <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center p-4">
              <div className="bg-white rounded-lg shadow-xl p-8 max-w-md w-full text-center">
                <CheckCircle className="w-16 h-16 text-green-500 mx-auto mb-4" />
                <h2 className="text-2xl font-bold text-gray-800 mb-2">
                  Schulung erfolgreich bestätigt!
                </h2>
                <p className="text-gray-600 mb-6">
                  Ihre Bestätigung wurde gespeichert und an Memberspot übermittelt.
                </p>
                <div className="bg-gray-50 rounded p-4 mb-6 text-left">
                  <p className="text-sm text-gray-700 mb-1">
                    <strong>E-Mail:</strong> {formData.email}
                  </p>
                  <p className="text-sm text-gray-700 mb-1">
                    <strong>Schulung:</strong> {formData.courseName}
                  </p>
                  <p className="text-sm text-gray-700">
                    <strong>Datum:</strong> {new Date().toLocaleDateString("de-DE", {
                      day: '2-digit',
                      month: 'long',
                      year: 'numeric'
                    })}
                  </p>
                </div>
                <button
                  onClick={downloadCertificate}
                  className="flex items-center justify-center gap-2 w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition-colors mb-3"
                >
                  <Download className="w-4 h-4" />
                  Bestätigung herunterladen
                </button>
                <button
                  onClick={() => {
                    setSubmitted(false);
                    setFormData({ email: "", courseId: "", courseName: "", understood: false });
                    clearSignature();
                  }}
                  className="w-full bg-gray-200 text-gray-700 py-2 rounded-lg hover:bg-gray-300 transition-colors"
                >
                  Neue Bestätigung
                </button>
              </div>
            </div>
          );
        }

        return (
          <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center p-4">
            <div className="bg-white rounded-lg shadow-xl p-8 max-w-2xl w-full">
              <h1 className="text-3xl font-bold text-gray-800 mb-2">Schulungsbestätigung</h1>
              <p className="text-gray-600 mb-6">
                Bitte bestätigen Sie den Abschluss Ihrer Schulung mit Ihrer digitalen Unterschrift.
              </p>

              <form onSubmit={handleSubmit} className="space-y-6">
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-2">
                    E-Mail-Adresse *
                  </label>
                  <input
                    type="email"
                    required
                    value={formData.email}
                    onChange={(e) => setFormData({ ...formData, email: e.target.value })}
                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    placeholder="ihre.email@firma.de"
                    disabled={isSubmitting}
                  />
                </div>

                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-2">
                    Kurs-ID *
                  </label>
                  <input
                    type="text"
                    required
                    value={formData.courseId}
                    onChange={(e) => setFormData({ ...formData, courseId: e.target.value })}
                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    placeholder="course_12345"
                    disabled={isSubmitting}
                  />
                </div>

                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-2">
                    Schulungsname *
                  </label>
                  <input
                    type="text"
                    required
                    value={formData.courseName}
                    onChange={(e) => setFormData({ ...formData, courseName: e.target.value })}
                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    placeholder="Datenschutz Grundschulung 2025"
                    disabled={isSubmitting}
                  />
                </div>

                <div className="bg-blue-50 border border-blue-200 rounded-lg p-4">
                  <h3 className="font-semibold text-gray-800 mb-2">Bestätigung</h3>
                  <label className="flex items-start gap-3 cursor-pointer">
                    <input
                      type="checkbox"
                      checked={formData.understood}
                      onChange={(e) => setFormData({ ...formData, understood: e.target.checked })}
                      className="mt-1 w-5 h-5 text-blue-600 border-gray-300 rounded focus:ring-blue-500"
                      disabled={isSubmitting}
                    />
                    <span className="text-sm text-gray-700">
                      Ich bestätige hiermit, dass ich die Schulungsinhalte vollständig durchgearbeitet,
                      verstanden habe und die darin enthaltenen Richtlinien einhalte. Ich bin mir bewusst,
                      dass diese Bestätigung rechtlich bindend ist.
                    </span>
                  </label>
                </div>

                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-2">
                    Digitale Unterschrift *
                  </label>
                  <div className="border-2 border-gray-300 rounded-lg overflow-hidden">
                    <canvas
                      ref={canvasRef}
                      onMouseDown={startDrawing}
                      onMouseMove={draw}
                      onMouseUp={stopDrawing}
                      onMouseLeave={stopDrawing}
                      onTouchStart={startDrawing}
                      onTouchMove={draw}
                      onTouchEnd={stopDrawing}
                      className="w-full bg-white cursor-crosshair touch-none"
                      style={{ height: "160px", touchAction: "none" }}
                    />
                  </div>
                  <button
                    type="button"
                    onClick={clearSignature}
                    disabled={isSubmitting}
                    className="mt-2 text-sm text-red-600 hover:text-red-700 flex items-center gap-1 disabled:opacity-50"
                  >
                    <XCircle className="w-4 h-4" />
                    Unterschrift löschen
                  </button>
                </div>

                <button
                  type="submit"
                  disabled={isSubmitting}
                  className="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition-colors shadow-lg disabled:opacity-50 disabled:cursor-not-allowed"
                >
                  {isSubmitting ? "⏳ Wird gesendet..." : "Schulung bestätigen und absenden"}
                </button>
              </form>

              <div className="mt-6 p-4 bg-gray-50 rounded-lg">
                <p className="text-xs text-gray-600">
                  <strong>Hinweis:</strong> Diese Bestätigung wird DSGVO-konform gespeichert und
                  an Ihr Memberspot-Profil übermittelt. Die Daten werden verschlüsselt übertragen
                  und können jederzeit gemäß Art. 17 DSGVO gelöscht werden.
                </p>
              </div>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<SignatureForm />);
    </script>
  </body>
</html>
